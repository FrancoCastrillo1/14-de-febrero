<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Lucía 🌹</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0608;
      --rose: #e8607a;
      --rose-light: #f4a0b0;
      --rose-dark: #9e2a40;
      --gold: #d4a853;
      --cream: #fdf0e8;
      --muted: #c4a098;
    }

    html, body { width:100%; height:100%; }

    body {
      background: var(--bg);
      font-family: 'Lora', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }

    /* ── CARD ── */
    .card {
      position: relative; z-index: 10;
      background: linear-gradient(160deg, #1a080c 0%, #120508 100%);
      border: 1px solid rgba(212,168,83,.3);
      border-radius: 24px;
      padding: 3.5rem 3rem 2.8rem;
      max-width: 520px; width: 90vw;
      text-align: center;
      box-shadow: 0 0 60px rgba(232,96,122,.12), 0 0 120px rgba(0,0,0,.8), inset 0 1px 0 rgba(212,168,83,.2);
      animation: cardIn 1.2s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(50px) scale(.95); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .card::before {
      content:'— ✦ —'; display:block;
      font-family:'Playfair Display',serif;
      color:var(--gold); font-size:.85rem;
      letter-spacing:.25em; margin-bottom:1.4rem; opacity:.8;
    }

    .for-name {
      font-family:'Playfair Display',serif; font-style:italic;
      font-size:1rem; color:var(--gold);
      letter-spacing:.18em; text-transform:uppercase;
      margin-bottom:.5rem; animation:fadeUp .8s .3s both;
    }
    .headline {
      font-family:'Playfair Display',serif;
      font-size:clamp(1.8rem,5vw,2.5rem); font-weight:700;
      color:var(--cream); line-height:1.25; margin-bottom:.5rem;
      animation:fadeUp .8s .5s both;
    }
    .headline em { font-style:italic; color:var(--rose-light); }

    .date-badge {
      display:inline-flex; align-items:center; gap:.4rem;
      margin:1.1rem auto; padding:.4rem 1.3rem;
      border:1px solid rgba(212,168,83,.45); border-radius:50px;
      font-size:.88rem; color:var(--gold); letter-spacing:.08em;
      animation:fadeUp .8s .7s both;
      cursor:pointer; transition:background .2s;
      position:relative; user-select:none;
    }
    .date-badge:hover { background:rgba(212,168,83,.08); }
    .date-badge input[type="date"] {
      position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; border:none;
    }

    .subtitle {
      font-size:1rem; color:var(--muted); line-height:1.75;
      margin:.8rem 0 1.8rem; font-style:italic;
      animation:fadeUp .8s .9s both;
    }

    /* ── FILA DE BOTONES ── */
    .btn-row {
      display:flex; align-items:center; justify-content:center; gap:1.2rem;
      animation:fadeUp .8s 1.1s both;
    }

    .btn {
      border:none; border-radius:50px;
      font-family:'Playfair Display',serif; font-weight:700;
      cursor:pointer; white-space:nowrap; line-height:1;
    }

    #btn-yes {
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
      color:#fff; font-size:1.1rem; padding:.85rem 2.2rem;
      box-shadow:0 4px 24px rgba(232,96,122,.45);
      transition:transform .15s, box-shadow .15s, font-size .4s, padding .4s;
      z-index:20;
    }
    #btn-yes:hover { transform:scale(1.07); box-shadow:0 6px 34px rgba(232,96,122,.65); }

    /* ── BOTÓN NO — fixed desde el arranque, posicionado por JS ── */
    #btn-no {
      position: fixed;        /* siempre fixed */
      z-index: 200;
      background: #180a0d;
      border: 1.5px solid rgba(196,160,152,.45);
      color: var(--muted);
      font-size: 1rem; padding: .7rem 1.6rem;
      /* transición suave al moverse */
      transition: left .2s cubic-bezier(.34,1.56,.64,1),
                  top  .2s cubic-bezier(.34,1.56,.64,1),
                  transform .3s ease,
                  font-size .3s, padding .3s;
      transform-origin: center center;
    }
    #btn-no:hover { background: rgba(255,255,255,.05); }

    /* placeholder que ocupa el espacio del NO en el flujo */
    #no-placeholder { display:inline-block; width:130px; height:44px; }

    #escape-msg {
      min-height:1.2rem; margin-top:.6rem;
      font-size:.78rem; color:rgba(196,160,152,.55); font-style:italic;
    }

    /* ── PANTALLA FINAL ── */
    #screen-yes {
      display:none; flex-direction:column; align-items:center; gap:1rem;
      animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.6); }
      to   { opacity:1; transform:scale(1); }
    }
    .big-emoji { font-size:4rem; }
    .yes-title {
      font-family:'Playfair Display',serif; font-size:2rem;
      font-style:italic; color:var(--rose-light); line-height:1.3;
    }
    .yes-sub { font-size:1rem; color:var(--muted); font-style:italic; }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .heart {
      position:fixed; pointer-events:none;
      animation:heartFloat 2.4s ease-out forwards; z-index:999;
    }
    @keyframes heartFloat {
      0%   { opacity:1; transform:translateY(0) scale(1); }
      100% { opacity:0; transform:translateY(-240px) scale(1.5) rotate(20deg); }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- Botón NO vive aquí, FUERA del card, siempre fixed -->
<button class="btn" id="btn-no">No, gracias</button>

<div class="card" id="card">
  <div id="content-main">
    <p class="for-name">Para Lucía Tresca</p>
    <h1 class="headline">¿Querés salir<br/>a <em>comer</em> conmigo?</h1>

    <div class="date-badge" title="Tocá para cambiar la fecha">
      📅 <span id="date-display">Pendiente de eleccion</span>
      <input type="date" id="date-input" />
    </div>

    <p class="subtitle">Buena comida, buena compañía<br/>y una noche que no vas a olvidar. Solo te va a costar entregar una parte de tu cuerpo a eleccion (por mi).</p>

    <div class="btn-row">
      <button class="btn" id="btn-yes" onclick="handleYes()"><a style="text-decoration: none; color: #c4a098;" href="cronograma.html">¡Sí, me encantaría!🌹</a></button>
      <!-- placeholder que reserva el espacio visual del NO -->
      <div id="no-placeholder"></div>
    </div>
    <p id="escape-msg">&nbsp;</p>
  </div>

  <div id="screen-yes">
    <div class="big-emoji">🥂</div>
    <p class="yes-title">¡Sabía que ibas<br/>a decir que sí!</p>
    <p class="yes-sub">Te espero con muchas ganas. 🌹</p>
  </div>
</div>

<script>
/* ── CANVAS pétalos ── */
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, petals = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', () => { resize(); placeNoOnPlaceholder(); });
const COLORS = ['#e8607a','#f4a0b0','#d4a853','#9e2a40','#fceee8'];
function mkPetal() {
  return { x:Math.random()*W, y:-20, r:3+Math.random()*5,
    speed:.35+Math.random()*.75, drift:(Math.random()-.5)*.5,
    rot:Math.random()*Math.PI*2, drot:(Math.random()-.5)*.04,
    color:COLORS[Math.floor(Math.random()*COLORS.length)], alpha:.12+Math.random()*.3 };
}
for (let i=0;i<45;i++){const p=mkPetal();p.y=Math.random()*H;petals.push(p);}
(function loop(){
  ctx.clearRect(0,0,W,H);
  petals.forEach(p=>{
    p.y+=p.speed;p.x+=p.drift;p.rot+=p.drot;
    if(p.y>H+20)Object.assign(p,mkPetal());
    ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*1.7,0,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();ctx.restore();
  });
  requestAnimationFrame(loop);
})();

/* ── FECHA ── */
const dateInput   = document.getElementById('date-input');
const dateDisplay = document.getElementById('date-display');
function fmtDate(d){
  const dias  =['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses =['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
}
dateDisplay.textContent = fmtDate(new Date(2025,4,3));
dateInput.addEventListener('change',()=>{
  if(!dateInput.value)return;
  const[y,m,d]=dateInput.value.split('-').map(Number);
  dateDisplay.textContent=fmtDate(new Date(y,m-1,d));
});

/* ── BOTÓN NO ── */
const btnNo      = document.getElementById('btn-no');
const btnYes     = document.getElementById('btn-yes');
const escapeMsg  = document.getElementById('escape-msg');
const placeholder= document.getElementById('no-placeholder');

let noScale  = 1;
let attempts = 0;
let ready    = false;   // true después del primer posicionamiento

const SHRINK    = 0.10;
const MIN_SCALE = 0.38;

const msgs = [
  "Ese botón no te quiere 😏",
  "¡Se fue corriendo! 🏃",
  "Hmm… se mueve solo…",
  "¡Casi! 😄",
  "El SÍ te está esperando 😉",
  "Ya casi no se ve… 🙈",
  "Insistente 😄",
  "Jaja no vas a poder 😂",
  "Es muy escurridizo 🐍",
];

// Alinea el NO encima del placeholder (su posición de reposo)
function placeNoOnPlaceholder() {
  const r = placeholder.getBoundingClientRect();
  btnNo.style.left = r.left + 'px';
  btnNo.style.top  = r.top  + 'px';
}

// Esperar a que la animación del card termine (~1.2s) para posicionar
window.addEventListener('load', () => {
  // Desactivar transición para el posicionamiento inicial (sin animación)
  btnNo.style.transition = 'none';
  placeNoOnPlaceholder();
  // Forzar reflow y re-activar transición
  btnNo.getBoundingClientRect();
  btnNo.style.transition = '';
  ready = true;
});

function randomPos() {
  const bW  = btnNo.offsetWidth;
  const bH  = btnNo.offsetHeight;
  const pad = 16;
  const vW  = window.innerWidth;
  const vH  = window.innerHeight;
  const yesR = btnYes.getBoundingClientRect();

  let nx, ny, tries = 0;
  do {
    nx = pad + Math.random() * (vW - bW - pad * 2);
    ny = pad + Math.random() * (vH - bH - pad * 2);
    tries++;
    // evitar solape con el botón SÍ
    const overlap = nx < yesR.right + 20 && nx + bW > yesR.left - 20
                 && ny < yesR.bottom + 20 && ny + bH > yesR.top - 20;
    if (!overlap) break;
  } while (tries < 25);

  return { nx, ny };
}

function onNoHover() {
  if (!ready) return;

  attempts++;

  // mensaje
  escapeMsg.textContent = msgs[Math.min(attempts - 1, msgs.length - 1)];

  // moverse a posición aleatoria en TODA la pantalla
  const { nx, ny } = randomPos();
  btnNo.style.left = nx + 'px';
  btnNo.style.top  = ny + 'px';
}

btnNo.addEventListener('mouseenter', onNoHover);
btnNo.addEventListener('touchstart', e => { e.preventDefault(); onNoHover(); }, { passive: false });

/* ── PANTALLA SÍ ── */
function handleYes() {
  document.getElementById('content-main').style.display = 'none';
  btnNo.style.display = 'none';
  const sc = document.getElementById('screen-yes');
  sc.style.display = 'flex';
  for (let i = 0; i < 22; i++) setTimeout(spawnHeart, i * 100);
}

function spawnHeart() {
  const h = document.createElement('span');
  h.className = 'heart';
  h.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
  h.textContent = ['❤️','🌹','💕','✨','🥂'][Math.floor(Math.random()*5)];
  h.style.left = (10 + Math.random() * 80) + 'vw';
  h.style.top  = (30 + Math.random() * 40) + 'vh';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 2600);
}
</script>
</body>
</html>
